<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entreteri Corte</title>
<meta name="description" content="Notícias, famosos e o que está bombando hoje. Siga a Entreteri Corte nas redes.">
<link rel="icon" href="logo.png">
<style>
  :root { --fundo:#F3F0EA; --texto:#111; --cinza:#6b6b6b; --vermelho:#E83E30; --botao:#111; --botao-texto:#fff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--fundo); color:var(--texto); font-family:-apple-system, "Helvetica Neue", Arial, sans-serif;
         min-height:100vh; display:flex; justify-content:center; padding:48px 16px; }
  main { width:100%; max-width:440px; text-align:center; }
  img.logo { width:112px; height:112px; border-radius:50%; object-fit:cover; border:2px solid #e2ddd4; }
  h1 { font-size:24px; margin-top:16px; letter-spacing:.5px; }
  p.sub { color:var(--cinza); margin:8px 0 32px; font-size:15px; line-height:1.4; }
  a.btn { display:flex; align-items:center; justify-content:center; gap:10px; background:var(--botao); color:var(--botao-texto);
          text-decoration:none; font-weight:700; font-size:16px; padding:16px; border-radius:14px; margin-bottom:12px;
          transition:transform .1s; }
  a.btn:active { transform:scale(.98); }
  a.btn svg { width:20px; height:20px; fill:currentColor; }
  a.btn.destaque { background:var(--vermelho); }
  footer { color:var(--cinza); font-size:12px; margin-top:32px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="Logo Entreteri Corte">
  <h1>Entreteri Corte</h1>
  <p class="sub">Notícias, famosos e o que está bombando hoje.</p>
  <a class="btn destaque" href="https://www.tiktok.com/@entretericorte" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24"><path d="M16.6 5.8a4.3 4.3 0 0 1-1-2.8h-3.1v12.4a2.6 2.6 0 1 1-2.6-2.6c.3 0 .5 0 .8.1V9.7a5.7 5.7 0 1 0 4.9 5.7V9.1a7.3 7.3 0 0 0 4.3 1.4V7.4a4.3 4.3 0 0 1-3.3-1.6z"/></svg>
    TikTok
  </a>
  <a class="btn" href="https://www.instagram.com/entretericorte/" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4zM17.3 5.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zM12 2c-2.7 0-3 0-4.1.1-4 .2-5.6 1.8-5.8 5.8C2 9 2 9.3 2 12s0 3 .1 4.1c.2 4 1.8 5.6 5.8 5.8C9 22 9.3 22 12 22s3 0 4.1-.1c4-.2 5.6-1.8 5.8-5.8.1-1.1.1-1.4.1-4.1s0-3-.1-4.1c-.2-4-1.8-5.6-5.8-5.8C15 2 14.7 2 12 2z"/></svg>
    Instagram
  </a>
  <a class="btn" href="https://www.youtube.com/channel/UCj4XAXPXvWIOoQL_9g6SQzw" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12 31 31 0 0 0 1 16.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8zM9.7 15V9l5.9 3-5.9 3z"/></svg>
    YouTube
  </a>
  <footer>Entreteri Corte</footer>
</main>
</body>
</html>
